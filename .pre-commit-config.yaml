repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform formatting
        entry: terraform fmt -recursive -check -diff
        language: system
        files: \.tf$
        pass_filenames: false

      - id: terraform-validate-bootstrap
        name: Terraform bootstrap validation
        entry: terraform -chdir=bootstrap validate
        language: system
        files: ^bootstrap/.*\.tf$
        pass_filenames: false

      - id: tflint-bootstrap
        name: TFLint bootstrap
        entry: tflint --chdir=bootstrap
        language: system
        files: ^bootstrap/.*\.tf$
        pass_filenames: false

      - id: checkov
        name: Checkov infrastructure security
        entry: checkov -d . --framework terraform --compact
        language: system
        files: \.tf$
        pass_filenames: false

      - id: gitleaks
        name: Gitleaks secret scan
        entry: gitleaks protect --staged --verbose --redact
        language: system
        files: .*
        pass_filenames: false

      - id: terraform-validate-infrastructure
        name: Terraform infrastructure validation
        entry: terraform -chdir=infrastructure validate
        language: system
        files: ^infrastructure/.*\.tf$
        pass_filenames: false

      - id: tflint-infrastructure
        name: TFLint infrastructure
        entry: tflint --chdir=infrastructure --recursive
        language: system
        files: ^infrastructure/.*\.tf$
        pass_filenames: false
